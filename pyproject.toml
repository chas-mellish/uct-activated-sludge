[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uct-activated-sludge"
version = "0.1.0"
description = "UCT Activated Sludge Model — Python modernization of legacy Pascal BNR simulation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "hypothesis",
    "ruff",
]

[project.scripts]
uct-as = "uct_activated_sludge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"
